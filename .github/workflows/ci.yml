# .github/workflows/ci.yml
# CI v1 : « ce code est-il sain ? » — sur chaque PR vers main, sur main, et appelé par release.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call: # permet à release.yml de réutiliser ce workflow (pas de copier-coller des tests)

# Moindre privilège : le GITHUB_TOKEN ne peut que lire le dépôt
permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # un run bloqué ne brûle pas tes minutes indéfiniment
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # ne laisse pas le token dans .git/config de la VM

      - name: Installer Python 3.12 (même version que le Dockerfile)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # entre guillemets : sinon YAML lit 3.12 comme un nombre (3.10 → 3.1 !)
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -q

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le code avec tout l'historique
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique, sinon gitleaks ne voit qu'un commit
          persist-credentials: false

      - name: Chercher des secrets (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact -v